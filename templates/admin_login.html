<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — SMM DIGITAL</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head>
<body class="login-page"><main class="login-card"><img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="SMM Digital"><h1>Welcome back</h1><p>Sign in to manage your marketplace</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<div class="input-icon"><i class="fa-solid fa-user"></i><input name="username" required autofocus autocomplete="username"></div></label><label>Password<div class="input-icon"><i class="fa-solid fa-lock"></i><input type="password" name="password" required autocomplete="current-password"></div></label><button class="primary-button" type="submit">Sign In <i class="fa-solid fa-arrow-right"></i></button></form><a class="back-link" href="{{ url_for('index') }}">← Back to website</a></main></body></html>
